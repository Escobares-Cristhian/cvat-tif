metadata:
  name: sam2-detector
  namespace: cvat
  annotations:
    name: SAM2 Detector
    version: "2"
    type: detector
    help_message: >
      Detect objects in remote‐sensing imagery using a text prompt
      and the SAM 2 segmentation model.
    spec: |
      [
        { "id": 1, "name": "object", "attributes": [] }
      ]

spec:
  description: Text‐prompted segmentation detector using SAM 2
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 1200s

  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam2

  build:
    baseImage: ubuntu:22.04

    directives:
      preCopy:
        # expose GPU
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility

        # disable apt prompts
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive

        # set working directory
        - kind: WORKDIR
          value: /opt/nuclio/sam2

        # install pip3 so we can use pip
        - kind: RUN
          value: |
            apt-get update && \
            apt-get install -y pip python3-pip git curl && \
            rm -rf /var/lib/apt/lists/*

        # ensure python → python3
        - kind: RUN
          value: |
            ln -sf /usr/bin/python3 /usr/bin/python && \
            ln -sf /usr/bin/pip3   /usr/bin/pip

        # upgrade pip
        - kind: RUN
          value: pip install --upgrade pip

        # 1) Install PyTorch with CUDA
        - kind: RUN
          value: |
            pip install \
              torch torchvision torchaudio \
              --index-url https://download.pytorch.org/whl/cu118

        # 2) clone the SAM2 source
        - kind: RUN
          value: |
            git clone https://github.com/facebookresearch/sam2.git /opt/nuclio/sam2

        # 3) install it in editable mode
        - kind: RUN
          value: pip install -e /opt/nuclio/sam2

        # 4) Install the rest of your Python deps
        - kind: RUN
          value: |
            pip install \
              opencv-python-headless \
              numpy \
              scikit-image \
              huggingface_hub \
              cvat-sdk

        # 5) Download the **SAM-2.1** Hiera-Large checkpoint
        - kind: RUN
          value: |
            curl -L \
              https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_large.pt \
              -o /opt/nuclio/sam2/sam2.1_hiera_large.pt

  triggers:
    httpTrigger:
      kind: http
      maxWorkers: 4
      workerAvailabilityTimeoutMilliseconds: 30000
      attributes:
        contextPath: /
        maxRequestBodySize: 1048576000  # 1000 MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
